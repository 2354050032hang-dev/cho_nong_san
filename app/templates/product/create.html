{% extends "base.html" %}
{% block content %}
<h3>Đăng tin bán sản phẩm</h3>
<form method="POST" enctype="multipart/form-data">
    <input name="ten" class="form-control mb-2" placeholder="Tên sản phẩm" required>
    <select name="danh_muc_id" class="form-select mb-2" required>
        <option value="">-- Chọn danh mục --</option>
        {% for dm in danh_mucs %}
        <option value="{{ dm.id }}">{{ dm.ten }}</option>
        {% endfor %}
    </select>
    <input name="gia" type="number" step="0.01" class="form-control mb-2" placeholder="Giá (VNĐ)" required>
    <input name="so_luong" type="number" class="form-control mb-2" placeholder="Số lượng">
    <input name="don_vi_tinh" class="form-control mb-2" placeholder="Đơn vị tính" value="kg">
    <input name="dia_chi" class="form-control mb-2" placeholder="Địa chỉ">
    <textarea name="mo_ta" class="form-control mb-2" placeholder="Mô tả"></textarea>
    <input type="file" name="hinh_anh" class="form-control mb-2" accept="image/*">
    <button class="btn btn-success">Đăng tin</button>
</form>
{% endblock %}
