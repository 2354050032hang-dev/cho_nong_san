{% extends "base.html" %}
{% block content %}
<h3>Sửa tin đăng</h3>
<form method="POST" enctype="multipart/form-data">
    <input name="ten" class="form-control mb-2" value="{{ product.ten }}" required>
    <select name="danh_muc_id" class="form-select mb-2">
        {% for dm in danh_mucs %}
        <option value="{{ dm.id }}" {% if dm.id == product.danh_muc_id %}selected{% endif %}>{{ dm.ten }}</option>
        {% endfor %}
    </select>
    <input name="gia" type="number" step="0.01" class="form-control mb-2" value="{{ product.gia }}" required>
    <input name="so_luong" type="number" class="form-control mb-2" value="{{ product.so_luong }}">
    <input name="don_vi_tinh" class="form-control mb-2" value="{{ product.don_vi_tinh }}">
    <input name="dia_chi" class="form-control mb-2" value="{{ product.dia_chi or '' }}">
    <select name="trang_thai" class="form-select mb-2">
        <option value="1" {% if product.trang_thai == 1 %}selected{% endif %}>Còn hàng</option>
        <option value="0" {% if product.trang_thai == 0 %}selected{% endif %}>Hết hàng</option>
    </select>
    <textarea name="mo_ta" class="form-control mb-2">{{ product.mo_ta or '' }}</textarea>
    <input type="file" name="hinh_anh" class="form-control mb-2" accept="image/*">
    <button class="btn btn-warning">Cập nhật</button>
    <a href="{{ url_for('product.detail', id=product.id) }}" class="btn btn-secondary">Hủy</a>
</form>
{% endblock %}
